<!DOCTYPE html>
<html lang="zh">
<head>

<title>06 我的</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2A2A2E;display:flex;justify-content:center;padding:24px;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
.phone{width:390px;height:844px;background:#F5F6F8;border-radius:44px;border:1px solid #000;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.demo{background:#1C1C1E;color:#fff;font-size:10px;text-align:center;padding:4px}
.status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600}
.header{height:48px;display:flex;align-items:center;padding:0 16px}
.hl{font-size:17px;font-weight:700}
.content{flex:1;overflow:hidden;padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.group{background:#fff;border:1px solid #E5E5EA;border-radius:14px;overflow:hidden;flex-shrink:0}
.gt{font-size:12px;color:#8E8E93;padding:10px 4px 4px}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #F1F1F4;font-size:14px;color:#1C1C1E;text-decoration:none}
.row:first-child{border-top:none}
.row .ic{width:24px;height:24px;border-radius:7px;background:#EDF1FB;color:#3B6FFF;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.row .chev{margin-left:auto;color:#C7C7CC}
.row .num{font-size:11px;color:#8E8E93;background:#F1F1F4;border-radius:6px;padding:1px 6px}
.row .num.blue{color:#3B6FFF;background:#EDF1FB}
.ident{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:40px;height:40px;border-radius:20px;background:#3B6FFF;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.ident .nm{font-size:15px;font-weight:700}
.ident .em{font-size:11px;color:#8E8E93}
.wsrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #F1F1F4}
.wsav{width:30px;height:30px;border-radius:8px;background:#E6F6EC;color:#1B8A4A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.tabbar{height:84px;background:#fff;border-top:1px solid #E5E5EA;display:flex;align-items:center;justify-content:space-around;padding:0 8px 24px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8E8E93;width:62px;text-decoration:none}
.tab.active{color:#3B6FFF}
.tab-icon{width:24px;height:24px;border-radius:6px;background:#E1E1E8}
.center{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#2F62F0,#3B6FFF 55%,#5B8AFF);margin-top:-28px;box-shadow:0 6px 16px rgba(59,111,255,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;text-decoration:none}
.ver{text-align:center;font-size:11px;color:#C7C7CC;padding:6px 0 0}
</style>
</head>

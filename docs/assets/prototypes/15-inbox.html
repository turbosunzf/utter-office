<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>15 收件箱 · utter-office</title>
<script>if(/(?:^|[?&])embed=1(?:&|$)/.test(location.search)||(parent!==window))document.documentElement.classList.add("embed")</script>
<link rel="stylesheet" href="_shared.css">
<style>
.back{display:flex;align-items:center;gap:4px;color:var(--brand-hex);text-decoration:none;font-size:17px;padding:8px}
.row{display:flex;gap:12px;padding:12px 16px;background:var(--background);text-decoration:none;color:inherit;border:none;width:100%;text-align:left;cursor:pointer;font:inherit}
.row:active{background:var(--secondary)}
.row.read .title{color:var(--muted-fg);font-weight:400}
.row .body{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:8px}
.top .l{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand-hex);flex-shrink:0}
.title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{width:14px;height:14px;border-radius:4px;flex-shrink:0}
.bot{display:flex;align-items:center;gap:8px;margin-top:2px}
.detail{flex:1;font-size:12px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.read .detail,.row.read .time{color:rgba(115,115,115,.6)}
.time{font-size:12px;color:var(--muted-fg);flex-shrink:0}
.sep{height:1px;background:var(--border);margin-left:64px}
</style>
</head>
<body>
<p class="stage-note"><b>收件箱</b> · 对齐 inbox.tsx · <a href="00-index.html">目录</a></p>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="right"><span>●●●</span><span>5G</span><span>🔋</span></div></div>
    <div class="app-header">
      <a class="back" href="02-home.html" data-back data-back-fallback="02-home.html" data-back-fallback-label="首页">
        <svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span data-back-label>首页</span>
      </a>
      <div class="title-wrap" style="text-align:center"><div class="title" style="font-size:17px">收件箱</div></div>
      <button class="icon-btn" type="button" aria-label="更多" onclick="alert('全部标为已读 / 归档已读 / 归档已完成 / 全部归档')">
        <svg class="ic" style="width:20px;height:20px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
    <div class="scroll" style="padding:0">
      <a class="row" href="05-workbench.html">
        <div class="avatar md" style="background:#F87171">m<span class="dot work" style="position:absolute"></span></div>
        <div class="body">
          <div class="top">
            <div class="l"><span class="dot"></span><span class="title">MUL-42 重构鉴权中间件</span></div>
            <span class="st" style="background:var(--brand-hex)"></span>
          </div>
          <div class="bot"><span class="detail">mika 提及了你</span><span class="time">2 分钟前</span></div>
        </div>
      </a>
      <div class="sep"></div>
      <a class="row" href="05-workbench.html">
        <div class="avatar md" style="background:#60A5FA">c</div>
        <div class="body">
          <div class="top">
            <div class="l"><span class="dot"></span><span class="title">MUL-55 看板泳道性能优化</span></div>
            <span class="st" style="background:var(--brand-hex)"></span>
          </div>
          <div class="bot"><span class="detail">指派给你</span><span class="time">18 分钟前</span></div>
        </div>
      </a>
      <div class="sep"></div>
      <a class="row" href="05-workbench.html">
        <div class="avatar md" style="background:#A78BFA">k</div>
        <div class="body">
          <div class="top">
            <div class="l"><span class="dot"></span><span class="title">MUL-48 首页报告卡动画</span></div>
            <span class="st" style="background:var(--teal)"></span>
          </div>
          <div class="bot"><span class="detail">状态变为待评审</span><span class="time">1 小时前</span></div>
        </div>
      </a>
      <div class="sep"></div>
      <a class="row read" href="05-workbench.html">
        <div class="avatar md" style="background:#F87171">m</div>
        <div class="body">
          <div class="top">
            <div class="l"><span class="title">MUL-40 底栏 IA 重构</span></div>

      <div class="sep"></div>
      <a class="row read" href="05-workbench.html">
        <div class="avatar md" style="background:#60A5FA">c</div>
        <div class="body">
          <div class="top">
            <div class="l"><span class="title">MUL-38 等 API Key</span></div>
            <span class="st" style="background:var(--priority)"></span>
          </div>
          <div class="bot"><span class="detail">需要你介入</span><span class="time">2 天前</span></div>
        </div>
      </a>
    </div>
  </div>
</div>
<script src="_shared.js"></script>

</html>

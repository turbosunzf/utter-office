<script src="_shared.js"></script>
<script>
(function () {
  var KEY = "proto-inbox-done";
  function loadDone() {
    try {
      return JSON.parse(sessionStorage.getItem(KEY) || "[]");
    } catch (e) {
      return [];
    }
  }
  function saveDone(arr) {
    try {
      sessionStorage.setItem(KEY, JSON.stringify(arr));
    } catch (e) {}
  }
  function apply() {
    var done = loadDone();
    var left = 0;
    document.querySelectorAll("[data-inbox-id]").forEach(function (row) {
      var id = row.getAttribute("data-inbox-id");
      var hide = done.indexOf(id) >= 0;
      row.classList.toggle("hidden", hide);
      if (!hide) left++;
    });
    var empty = document.querySelector("[data-inbox-empty]");
    var list = document.querySelector("[data-inbox-list]");
    if (empty) empty.classList.toggle("hidden", left > 0);
    if (list) list.classList.toggle("hidden", left === 0);
  }
  document.querySelectorAll("[data-inbox-done]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var id = btn.getAttribute("data-inbox-done");
      var done = loadDone();
      if (done.indexOf(id) < 0) done.push(id);
      saveDone(done);
      if (window.__protoToast) window.__protoToast("已标为已处理");
      apply();
    });
  });
  var clearAll = document.querySelector("[data-inbox-clear-all]");
  if (clearAll) {
    clearAll.addEventListener("click", function () {
      var ids = [];
      document.querySelectorAll("[data-inbox-id]").forEach(function (r) {
        ids.push(r.getAttribute("data-inbox-id"));
      });
      saveDone(ids);
      if (window.__protoToast) window.__protoToast("全部标为已处理");
      apply();
    });
  }
  apply();
})();
</script>

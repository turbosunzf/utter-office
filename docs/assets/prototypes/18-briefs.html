<style>
.brief-tabs {
  display: flex; gap: 18px; overflow-x: auto; padding: 10px 16px 6px;
  background: #fff; border-bottom: 1px solid var(--hairline); scrollbar-width: none;
}
.brief-tabs::-webkit-scrollbar { display: none; }
.brief-tabs button {

}
.rank { width: 22px; height: 22px; text-align: center; font-size: 14px; font-weight: 700; line-height: 22px; color: #9CA3AF; flex-shrink: 0; }
.rank.hot { border-radius: 11px; background: #E53935; color: #fff; font-size: 13px; }
.ttl { font-size: 16px; font-weight: 700; line-height: 22px; }
.meta { margin-top: 6px; font-size: 12px; color: var(--muted-fg); display: flex; align-items: center; }
.hit { margin-left: auto; background: #F5F5F5; border-radius: 3px; padding: 2px 6px; }
.hit .n { color: #E53935; font-weight: 600; margin-left: 4px; }

<script src="_shared.js"></script>
<script>
(function () {
  var tabs = document.querySelectorAll("[data-tab]");
  var rows = document.querySelectorAll("[data-cat]");
  tabs.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabs.forEach(function (b) { b.classList.toggle("on", b === btn); });
      var cat = btn.getAttribute("data-tab");
      rows.forEach(function (row) {
        row.style.display = cat === "all" || row.getAttribute("data-cat") === cat ? "flex" : "none";
      });
    });
  });
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>10 秘书设置 · utter-office</title>
<script>if(/(?:^|[?&])embed=1(?:&|$)/.test(location.search)||(parent!==window))document.documentElement.classList.add("embed")</script>
<link rel="stylesheet" href="_shared.css">
<style>
.back{display:flex;align-items:center;color:var(--brand-hex);text-decoration:none;padding:8px}
.sec-h{font-size:13px;font-weight:600;color:var(--muted-fg);margin-bottom:8px;padding:0 4px;letter-spacing:.02em}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card)}
.row{display:flex;align-items:center;padding:14px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .t{font-size:14px;flex:1}
.row .val{font-size:13px;color:var(--muted-fg);margin-right:4px}
.block{padding:12px 16px;border-bottom:1px solid var(--border)}
.block:last-child{border-bottom:none}
.block .t{font-size:14px;margin-bottom:8px}
.seg{display:flex;background:var(--well);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:none;background:transparent;border-radius:6px;padding:7px 0;font-size:13px;font-weight:500;color:var(--muted-fg);cursor:pointer}
.seg button.on{background:var(--brand-hex);color:#fff}
.switch-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--brand-hex);position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.placeholder{padding:16px;opacity:.55;font-size:14px;color:var(--muted-fg);line-height:1.45}
</style>
</head>
<body>
<p class="stage-note"><b>秘书设置</b> · 对齐 <code>assistant.tsx</code> · <a href="00-index.html">目录</a></p>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="right"><span>●●●</span><span>5G</span><span>🔋</span></div></div>
    <div class="app-header" style="min-height:44px;padding:0 4px">
      <a class="back" href="06-mine.html" data-back data-back-fallback="06-mine.html" data-back-fallback-label="我的"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
      <div class="title-wrap" style="text-align:center"><div class="title" style="font-size:17px">秘书设置</div></div>
      <div style="width:44px"></div>
    </div>
    <div class="scroll" style="padding:16px;display:flex;flex-direction:column;gap:20px">
      <div>
        <div class="sec-h">默认数字员工</div>
        <div class="card">
          <a class="row" href="09-staff-picker.html#default">
            <span class="t">默认员工</span>
            <span class="val">mika</span>
            <span style="color:var(--muted-fg)">›</span>
          </a>
        </div>
      </div>
      <div>
        <div class="sec-h">语音</div>
        <div class="card">
          <div class="block">
            <div class="t">长按录音阈值</div>
            <div class="seg" id="hold-seg">
              <button type="button">0.5s</button>
              <button type="button">1s</button>
              <button type="button" class="on">2s</button>
            </div>
          </div>
          <div class="switch-row">
            <span class="t" style="flex:1;font-size:14px">松手后自动跳工作台</span>
            <div class="switch"></div>
          </div>
          <div class="block">
            <div class="t">语音入口默认项</div>
            <div class="seg" id="entry-seg">
              <button type="button" class="on">录音</button>
              <button type="button">翻译</button>
              <button type="button">发语音</button>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="sec-h">简报推送</div>
        <div class="card">
          <div class="placeholder">分类与推送时间待后端 `/api/briefs` 契约（B-2）后开放。</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll("#hold-seg button, #entry-seg button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      btn.parentElement.querySelectorAll("button").forEach(function (b) { b.classList.remove("on"); });
      btn.classList.add("on");
    });
  });
</script>
<script src="_shared.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>03 看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2A2A2E;display:flex;justify-content:center;padding:24px;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
.phone{width:390px;height:844px;background:#F5F6F8;border-radius:44px;border:1px solid #000;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.demo{background:#1C1C1E;color:#fff;font-size:10px;text-align:center;padding:4px}
.status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600}
.header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.hl{font-size:17px;font-weight:700}
.hic{display:flex;gap:12px}
.hic .dot{width:24px;height:24px;border-radius:8px;background:#E1E1E8}
.notice{display:flex;align-items:center;gap:8px;background:#FFF8E6;border-bottom:1px solid #FFE8B3;padding:8px 14px;font-size:12px;color:#8A6116}
.notice .act{margin-left:auto;color:#3B6FFF;font-weight:600;text-decoration:none}
.filterbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:8px}
.sel{font-size:12px;color:#1C1C1E;background:#fff;border:1px solid #E1E1E8;border-radius:8px;padding:6px 10px}
.viewseg{display:flex;border:1px solid #E1E1E8;border-radius:8px;overflow:hidden;background:#fff}
.viewseg span{font-size:11px;padding:6px 10px;color:#8E8E93}
.viewseg span.on{background:#3B6FFF;color:#fff}
.content{flex:1;overflow:hidden;padding:0 12px 0 16px}
.colhead{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
.colname{font-size:13px;font-weight:700}
.pager{font-size:11px;color:#8E8E93}
.issues{display:flex;flex-direction:column;gap:10px}
.issue{background:#fff;border:1px solid #E5E5EA;border-radius:14px;padding:12px;text-decoration:none;color:inherit;display:block}
.issue .ti{font-size:14px;font-weight:600;margin-bottom:8px}
.issue .meta{display:flex;align-items:center;gap:6px;font-size:10px;color:#8E8E93;flex-wrap:wrap}
.ava{width:18px;height:18px;border-radius:9px;background:#FFD9D9;color:#C42;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.issue .run{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#3B6FFF}
.issue .run i{width:8px;height:8px;border-radius:4px;background:#3B6FFF;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
.dots{display:flex;justify-content:center;gap:6px;padding:12px 0}
.dots i{width:8px;height:8px;border-radius:4px;background:#D1D1D6}
.dots i.on{background:#3B6FFF}
.tabbar{height:84px;background:#fff;border-top:1px solid #E5E5EA;display:flex;align-items:center;justify-content:space-around;padding:0 8px 24px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8E8E93;width:62px;text-decoration:none}
.tab.active{color:#3B6FFF}
.tab-icon{width:24px;height:24px;border-radius:6px;background:#E1E1E8;position:relative}
.center{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#2F62F0,#3B6FFF 55%,#5B8AFF);margin-top:-28px;box-shadow:0 6px 16px rgba(59,111,255,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;text-decoration:none}
.tab.warn .tab-icon::after{content:"";position:absolute;top:0;right:-2px;width:7px;height:7px;border-radius:4px;background:#FF9500}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="demo">原型演示 · 阻断条三屏复用 · 运行中卡片进工作台 HITL</div>
    <div class="status"><span>9:41</span><span>●●● 5G 🔋</span></div>
    <div class="header">
      <div class="hl">看板</div>
      <div class="hic"><div class="dot">⚙</div><div class="dot">🔍</div><div class="dot">＋</div></div>
    </div>
    <div class="notice">
      <span>⚠️</span> 有员工工位未绑定，任务可能无法执行
      <a class="act" href="08-staff-profile.html#cap">去绑定 ›</a>
    </div>
    <div class="filterbar">
      <span class="sel">全部项目 ▾</span>
      <span class="viewseg"><span class="on">列</span><span>泳道</span><span>进度</span></span>
    </div>
    <div class="content">
      <div class="colhead">
        <span class="colname">进行中 (5)</span>
        <span class="pager">‹ 2 / 6 ›</span>
      </div>
      <div class="issues">
        <a class="issue" href="05-workbench.html">
          <div class="ti">MUL-42 重构鉴权中间件</div>
          <div class="meta"><span class="ava">m</span> mika · 高 · Auth 重构 · <span class="run"><i></i>运行中 · 点此介入</span></div>
        </a>
        <div class="issue">
          <div class="ti">MUL-45 补 sqlc 查询</div>
          <div class="meta"><span class="ava" style="background:#DFE9FF;color:#3B6FFF">c</span> codex · 中 · Auth 重构</div>
        </div>
        <div class="issue">
          <div class="ti">MUL-47 迁移数据看板</div>
          <div class="meta"><span class="ava" style="background:#E6F6EC;color:#1B8A4A">m</span> mika · 中 · 数据平台</div>
        </div>
      </div>
      <div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="tabbar">
      <a class="tab" href="02-home.html"><div class="tab-icon"></div>首页</a>
      <a class="tab active" href="03-board.html"><div class="tab-icon" style="background:#C9D9FF"></div>看板</a>
      <a class="center" href="04-voice.html">●</a>
      <a class="tab warn" href="05-workbench.html"><div class="tab-icon"></div>工作台</a>
      <a class="tab" href="06-mine.html"><div class="tab-icon"></div>我的</a>
    </div>
  </div>
</div>
</body>
</html>

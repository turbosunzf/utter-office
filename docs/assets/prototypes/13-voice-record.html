<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>录音 · utter-office</title>
<script>if(/(?:^|[?&])embed=1(?:&|$)/.test(location.search)||(parent!==window))document.documentElement.classList.add("embed")</script>
<link rel="stylesheet" href="_shared.css">
<style>
.page{display:flex;flex-direction:column;height:100%;background:var(--background)}
.nav{display:flex;align-items:center;min-height:44px;padding:0 8px;border-bottom:1px solid var(--hairline);background:var(--background)}
.nav .back{color:var(--brand-hex);text-decoration:none;display:flex;align-items:center;padding:8px}
.nav .title{flex:1;text-align:center;font-size:17px;font-weight:600;margin-right:44px}
.banner{margin:8px 16px 4px;padding:8px 12px;border-radius:8px;background:var(--secondary);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted-fg)}
.banner .tag{font-size:9px;border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.caps{display:flex;gap:8px;padding:8px 16px 12px;flex-wrap:wrap}
.cap{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;background:var(--secondary);border:1px solid var(--border)}
.cap .dot{width:6px;height:6px;border-radius:3px;background:var(--brand-hex)}
.cap .dot.warn{background:var(--warning)}
.cap .dot.off{background:var(--muted-fg)}
.lines{flex:1;overflow-y:auto;padding:0 16px 16px}
.line{margin-bottom:16px}
.spk{display:inline-flex;border-radius:999px;padding:2px 8px;background:var(--secondary);font-size:12px;color:var(--muted-fg)}
.zh{margin-top:6px;font-size:16px;line-height:1.5}
.en{margin-top:2px;font-size:14px;line-height:1.4;color:var(--muted-fg)}
.empty{padding:96px 0;text-align:center;color:var(--muted-fg)}
.dock{background:#fff;border-top:1px solid var(--border);border-radius:24px 24px 0 0;padding:12px 0 calc(var(--safe-bottom) + 8px)}
.dock-top{display:flex;align-items:center;gap:8px;padding:0 16px}
.clock{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.orb{width:52px;height:52px;border-radius:26px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.orb.play{background:linear-gradient(135deg,#3B6FFF,#6B9BFF);box-shadow:0 4px 10px rgba(59,111,255,.28);color:#fff}
.orb.stop{background:#E8ECF4;color:var(--foreground)}
.tools{display:flex;justify-content:space-around;padding:16px 16px 0}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted-fg);position:relative;border:none;background:none;cursor:pointer}
.tool .badge{position:absolute;top:-4px;right:-8px;background:var(--destructive);color:#fff;font-size:10px;border-radius:999px;padding:0 4px;min-width:14px}
.hw{text-align:center;font-size:12px;color:var(--muted-fg);padding-top:16px}
.cand-sheet{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:40}
.cand-sheet.show{display:flex}
.cand-body{width:100%;background:var(--surface-2);border-radius:20px 20px 0 0;padding:12px 16px calc(var(--safe-bottom)+16px)}
.cand-body .h{font-size:16px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:-.2px}
.cand-body .s{font-size:12px;color:var(--text-secondary);text-align:center;margin-bottom:12px}
.cand{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--hairline);border-radius:10px;margin-bottom:8px;background:var(--well);border-left:3px solid var(--brand-hex)}
.cand label{display:flex;gap:10px;align-items:flex-start;width:100%;cursor:pointer}
.cand .t{font-size:14px;font-weight:700}
.cand .m{font-size:11px;color:var(--text-secondary);margin-top:2px;font-family:var(--mono)}
.cand-cta{width:100%;height:44px;border:none;border-radius:10px;background:var(--brand-hex);color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px}
.cand-skip{width:100%;height:40px;border:none;border-radius:10px;background:var(--secondary);font-size:14px;font-weight:650;cursor:pointer;margin-top:8px;color:var(--text-primary)}
</style>
</head>
<body>
<p class="stage-note"><b>录音捕捉</b> · <a href="00-index.html">目录</a></p>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="right"><span>●●●</span><span>5G</span><span>🔋</span></div></div>
    <div class="page">
      <div class="nav">
        <a class="back" href="04-voice.html" data-back data-back-fallback="04-voice.html" data-back-fallback-label="Context"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
        <div class="title">录音捕捉</div>
      </div>
      <div class="caps">
        <span class="cap"><i class="dot" id="status-dot"></i><span id="status-label">转写中</span></span>
        <span class="cap">中 ↔ 英</span>
      </div>
      <div class="lines" id="lines">
        <div class="line">
          <span class="spk">说话人1 · 00:00</span>
          <div class="zh">这个需求我们先从语音入口开始，把录音和翻译两个页面做起来。</div>
          <div class="en">Let's start from the voice entry and build the recording and translation pages.</div>
        </div>
        <div class="line">
          <span class="spk">说话人2 · 00:03</span>
          <div class="zh">可以，录音页要有个实时转写列表和底部控制区。</div>
          <div class="en">Sure, the recording page needs a live transcript list and a bottom control dock.</div>
        </div>
      </div>
      <div class="dock">
        <div class="dock-top">
          <svg class="ic" style="width:22px;height:22px;color:var(--brand-hex)" viewBox="0 0 24 24"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
          <span class="clock" id="clock">0:00</span>
          <div class="flex-1"></div>
          <button type="button" class="orb play" id="btn-pause" aria-label="暂停">
            <svg class="ic" id="pause-icon" style="width:26px;height:26px;color:#fff" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1" fill="#fff" stroke="none"/><rect x="6" y="4" width="4" height="16" rx="1" fill="#fff" stroke="none"/></svg>
          </button>
          <div style="width:12px"></div>
          <button type="button" class="orb stop" id="btn-stop" aria-label="停止">
            <svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
        <div class="tools">
          <button type="button" class="tool" id="btn-photo"><svg class="ic" style="width:22px;height:22px;color:var(--foreground)" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>拍照</button>
          <button type="button" class="tool"><svg class="ic" style="width:22px;height:22px;color:var(--foreground)" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>上传附件</button>
          <button type="button" class="tool"><svg class="ic" style="width:22px;height:22px;color:var(--foreground)" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>快速记录</button>
          <button type="button" class="tool"><svg class="ic" style="width:22px;height:22px;color:var(--foreground)" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg><span class="badge">3</span>记录要点</button>
        </div>
        <div class="hw" style="display:none"></div>
      </div>
    </div>
    <div class="cand-sheet" id="cand-sheet">
      <div class="cand-body" onclick="event.stopPropagation()">
        <div class="grabber"></div>
        <div class="h">事项候选</div>
        <div class="s" style="display:none"></div>
        <div class="cand">
          <label>
            <input type="checkbox" checked data-cand-id="UO-40" data-cand-title="整理周五试点名单并跟踪">
            <div>
              <div class="t">整理周五试点名单并跟踪</div>
              <div class="m">UO-40 · 建议 nova</div>
            </div>
          </label>
        </div>
        <div class="cand">
          <label>
            <input type="checkbox" checked data-cand-id="UO-41" data-cand-title="对齐鉴权重构验收口径">
            <div>
              <div class="t">对齐鉴权重构验收口径</div>
              <div class="m">UO-41 · 建议 mika</div>
            </div>
          </label>
        </div>
        <button type="button" class="cand-cta" id="cand-confirm">加入待接活</button>
        <button type="button" class="cand-skip" id="cand-skip">跳过</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var pool = [
    { speaker: "说话人1", text: "周五前要把试点名单落下来，nova 盯一下。", translation: "Get the pilot list done by Friday; nova to track." },
    { speaker: "说话人2", text: "鉴权重构的验收口径还要对齐一下。", translation: "We still need to align the auth refactor acceptance criteria." },
    { speaker: "说话人1", text: "对，录音停了就直接进待接活。", translation: "Right — after stop, push candidates into the dispatch queue." },
    { speaker: "说话人2", text: "翻译页内部流程先不动，壳保持一致。", translation: "Leave translate internals alone; keep the shell consistent." }
  ];
  var elapsed = 0, paused = false, stopped = false, poolIndex = 0;
  var clock = document.getElementById("clock");
  var lines = document.getElementById("lines");
  var statusLabel = document.getElementById("status-label");
  var statusDot = document.getElementById("status-dot");
  var pauseBtn = document.getElementById("btn-pause");
  var pauseIcon = document.getElementById("pause-icon");
  var candSheet = document.getElementById("cand-sheet");

  function fmt(s) {
    var m = Math.floor(s / 60), sec = s % 60;
    return m + ":" + String(sec).padStart(2, "0");
  }
  function setStatus() {
    if (stopped) { statusLabel.textContent = "已停止"; statusDot.className = "dot off"; }
    else if (paused) { statusLabel.textContent = "已暂停"; statusDot.className = "dot warn"; }
    else { statusLabel.textContent = "转写中"; statusDot.className = "dot"; }
    var showPlay = paused || stopped;
    pauseIcon.innerHTML = showPlay
      ? '<polygon points="6 3 20 12 6 21 6 3" fill="#fff" stroke="none"/>'
      : '<rect x="14" y="4" width="4" height="16" rx="1" fill="#fff" stroke="none"/><rect x="6" y="4" width="4" height="16" rx="1" fill="#fff" stroke="none"/>';
    pauseBtn.setAttribute("aria-label", showPlay ? "继续" : "暂停");
  }
  function append(line) {
    var div = document.createElement("div");
    div.className = "line";
    div.innerHTML = '<span class="spk">' + line.speaker + " · " + line.time + '</span><div class="zh">' + line.text + '</div><div class="en">' + line.translation + "</div>";
    lines.appendChild(div);
    lines.scrollTop = lines.scrollHeight;
  }
  setInterval(function () {
    if (paused || stopped) return;
    elapsed += 1;
    clock.textContent = fmt(elapsed);
    if (elapsed % 3 === 0) {
      var next = pool[poolIndex % pool.length];
      poolIndex += 1;
      append({ speaker: next.speaker, time: fmt(elapsed), text: next.text, translation: next.translation });
    }
  }, 1000);

  pauseBtn.addEventListener("click", function () {
    if (stopped) {
      stopped = false; paused = false; elapsed = 0; poolIndex = 0;
      clock.textContent = "0:00";
      lines.innerHTML = '<div class="line"><span class="spk">说话人1 · 00:00</span><div class="zh">这个需求我们先从语音入口开始，把录音和翻译两个页面做起来。</div><div class="en">Let\'s start from the voice entry and build the recording and translation pages.</div></div><div class="line"><span class="spk">说话人2 · 00:03</span><div class="zh">可以，录音页要有个实时转写列表和底部控制区。</div><div class="en">Sure, the recording page needs a live transcript list and a bottom control dock.</div></div>';
      setStatus();
      return;
    }
    paused = !paused;
    setStatus();
  });
  document.getElementById("btn-stop").addEventListener("click", function () {
    stopped = true; paused = false;
    setStatus();
    lines.innerHTML = '<div class="empty"><div style="font-size:14px;font-weight:700">已结束</div></div>';
    if (candSheet) candSheet.classList.add("show");
  });
  document.getElementById("cand-skip").addEventListener("click", function () {
    candSheet.classList.remove("show");
  });
  document.getElementById("cand-confirm").addEventListener("click", function () {
    var list = [];
    document.querySelectorAll("[data-cand-id]").forEach(function (inp) {
      if (inp.checked) {
        list.push({
          id: inp.getAttribute("data-cand-id"),
          title: inp.getAttribute("data-cand-title"),
        });
      }
    });
    if (!list.length) {
      alert("请至少选一条候选");
      return;
    }
    try {
      sessionStorage.setItem("proto-voice-candidates", JSON.stringify(list));
    } catch (e) {}
    if (window.__protoGo) {
      window.__protoGo("05-workbench.html", "fromVoice=1&tab=todo");
    } else {
      var embed = /(?:^|[?&])embed=1(?:&|$)/.test(location.search) ? "&embed=1" : "";
      location.href = "05-workbench.html?fromVoice=1&tab=todo" + embed;
    }
  });
  var photo = document.getElementById("btn-photo");
  if (photo) {
    photo.addEventListener("click", function () {
      if (sessionStorage.getItem("proto-cam") === "1") {
        alert("已保存：照片已附到本次录音。");
        return;
      }
      if (confirm("拍照需要使用相机和相册。允许吗？")) {
        sessionStorage.setItem("proto-cam", "1");
        alert("已保存：照片已附到本次录音。");
      }
    });
  }
})();
</script>
<script src="_shared.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>设置 · utter-office</title>
<script>if(/(?:^|[?&])embed=1(?:&|$)/.test(location.search)||(parent!==window))document.documentElement.classList.add("embed")</script>
<link rel="stylesheet" href="_shared.css">
<style>
.sec-h{font-size:13px;font-weight:600;color:var(--muted-fg);margin-bottom:8px;padding:0 4px}
.back{display:flex;align-items:center;color:var(--brand-hex);text-decoration:none;padding:8px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.row .t{font-size:16px;font-weight:500}
.row .s{font-size:12px;color:var(--muted-fg);margin-top:4px;line-height:1.4}
.signout{width:100%;height:48px;border:none;border-radius:12px;background:#FEE2E2;color:#B91C1C;font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<p class="stage-note"><b>设置</b> · <a href="00-index.html">目录</a></p>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="right"><span>●●●</span><span>5G</span><span>🔋</span></div></div>
    <div class="app-header" style="min-height:44px;padding:0 4px">
      <a class="back" href="06-mine.html" data-back data-back-fallback="06-mine.html"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
      <div class="title-wrap" style="text-align:center"><div class="title" style="font-size:17px">设置</div></div>
      <div style="width:44px"></div>
    </div>
    <div class="scroll" style="padding:16px;display:flex;flex-direction:column;gap:20px">
      <div>
        <div class="sec-h">账户</div>
        <div class="card">
          <div class="row">
            <div class="avatar" style="width:40px;height:40px;background:rgba(59,111,255,.15);color:var(--brand-hex);display:flex;align-items:center;justify-content:center;font-weight:700">SU</div>
            <div class="flex-1"><div class="t">Sun</div><div class="s">sun@utter.office</div></div>
            <span style="color:var(--muted-fg)">›</span>
          </div>
        </div>
      </div>
      <div>
        <div class="sec-h">录音</div>
        <div class="card">
          <div class="row">
            <div class="flex-1">
              <div class="t">悬浮窗</div>
              <div class="s">录制中在其他应用上方显示计时。打开后会跳转系统权限页。</div>
            </div>
            <button type="button" class="ios-switch" id="overlay-sw" aria-label="悬浮窗"></button>
          </div>
        </div>
      </div>
      <button type="button" class="signout" id="signout">退出登录</button>
    </div>
  </div>
</div>
<script src="_shared.js"></script>
<script>
(function () {
  var sw = document.getElementById("overlay-sw");
  if (sw) {
    if (sessionStorage.getItem("proto-overlay") === "1") sw.classList.add("on");
    sw.addEventListener("click", function () {
      if (sw.classList.contains("on")) {
        sw.classList.remove("on");
        sessionStorage.setItem("proto-overlay", "0");
        return;
      }
      if (confirm("录制中可在其他 App 上方显示计时条。前往系统设置开启「显示在其他应用的上层」？")) {
        sw.classList.add("on");
        sessionStorage.setItem("proto-overlay", "1");
      }
    });
  }
  var out = document.getElementById("signout");
  if (out) {
    out.addEventListener("click", function () {
      if (!confirm("退出当前工作区？")) return;
      if (window.__protoToast) window.__protoToast("已退出");
      setTimeout(function () {
        if (window.__protoGo) window.__protoGo("02-home.html");
        else location.href = "02-home.html";
      }, 400);
    });
  }
})();
</script>
</body>
</html>

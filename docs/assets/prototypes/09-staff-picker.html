<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>09 员工选择器 · utter-office</title>
<script>if(/(?:^|[?&])embed=1(?:&|$)/.test(location.search)||(parent!==window))document.documentElement.classList.add("embed")</script>
<link rel="stylesheet" href="_shared.css">
<style>
.sheet-page {
  position: absolute; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: flex-end;
}
.sheet-body {
  width: 100%; height: 70%; background: #fff; border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet-h {
  padding: 8px 16px 12px; border-bottom: 1px solid var(--hairline); text-align: center; position: relative;
}
.sheet-h .grabber { margin: 4px auto 10px; }
.sheet-h .t { font-size: 16px; font-weight: 700; }
.sheet-h .s { font-size: 12px; color: var(--muted-fg); margin-top: 4px; }
.sheet-h .close {
  position: absolute; right: 12px; top: 28px; width: 32px; height: 32px;
  border: none; background: var(--secondary); border-radius: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.row {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  text-decoration: none; color: inherit; border-bottom: 1px solid #F1F1F4;
}
.row .name { font-size: 16px; font-weight: 600; }
.row .sub { font-size: 12px; color: var(--muted-fg); margin-top: 2px; }
.row .st { width: 8px; height: 8px; border-radius: 4px; }
.backdrop-phone {
  position: absolute; inset: 0; filter: blur(2px); opacity: .5; pointer-events: none;
  background: var(--background);
}
</style>
</head>
<body>
<p class="stage-note"><b>员工选择器</b> · dispatch / default · <a href="00-index.html">目录</a></p>
<div class="phone">
  <div class="screen">
    <div class="backdrop-phone"></div>
    <div class="sheet-page">
      <div class="sheet-body">
        <div class="sheet-h">
          <div class="grabber"></div>
          <div class="t" id="picker-title">选择数字员工</div>
          <div class="s" data-picker-intent>派单 · 选中后预填负责人并进入新建事项</div>
          <a class="close" href="02-home.html" data-back data-back-fallback="02-home.html" aria-label="关闭"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
        </div>
        <div class="scroll" style="flex:1">
          <a class="row" href="02-home.html" onclick="if(location.hash==='#default'){location.href='10-assistant-settings.html';return false;}">
            <div class="avatar lg" style="background:#F87171">m</div>
            <div class="flex-1">
              <div class="name">mika</div>
              <div class="sub">工位未绑定 · 任务可能无法执行</div>
            </div>
            <span class="st" style="background:var(--brand-hex)"></span>
          </a>
          <a class="row" href="02-home.html" onclick="if(location.hash==='#default'){location.href='10-assistant-settings.html';return false;}">
            <div class="avatar lg" style="background:#60A5FA">c</div>
            <div class="flex-1">
              <div class="name">codex</div>
              <div class="sub">工位已绑定 · local-daemon</div>
            </div>
            <span class="st" style="background:var(--success)"></span>
          </a>
          <a class="row" href="08-staff-profile.html">
            <div class="avatar lg" style="background:#A78BFA">k</div>
            <div class="flex-1">
              <div class="name">kimi</div>
              <div class="sub">离线 · 工位已绑定</div>
            </div>
            <span class="st" style="background:#D1D1D6"></span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="_shared.js"></script>
</body>
</html>

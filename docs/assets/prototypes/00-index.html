<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>utter-office 交互原型讲解</title>
<link rel="stylesheet" href="_shell.css">
</head>
<body>
<div class="shell">
  <aside class="nav">
    <div class="nav-brand">
      <h1>utter-office 原型</h1>
      <p>左选屏 · 中预览 · 右说明<br>手机内交互按真实 App 路由</p>
    </div>
    <div class="nav-scroll" id="nav"></div>
  </aside>

  <main class="stage">
    <div class="stage-bar">
      <span>当前预览</span>
      <span class="route" id="stage-route">/{slug}/home</span>
    </div>
    <div class="phone-frame">
      <iframe id="phone" title="App 预览" src="02-home.html?embed=1"></iframe>
    </div>
  </main>

  <aside class="aside">
    <div class="aside-scroll" id="aside"></div>
  </aside>
</div>

<script>
(function () {
  var SCREENS = [
    { group: "底栏", id: "01", file: "01-tab-ia.html", title: "信息架构", route: "tabs/_layout",
      lead: "底栏 2+1+2。中央录音不是导航目标：短按 Sheet、长按 Overlay。",
      points: ["选中 Tab：图标井浅蓝底 + brand 色", "中央按钮 58×58、圆角 18、品牌渐变，栏内居中不突出", "未读 badge 用 brand，非系统红"],
      tip: "在预览里点底栏可切换真实 Tab，不会跳出讲解壳。" },
    { group: "底栏", id: "02", file: "02-home.html", title: "首页", route: "/{slug}/home",
      lead: "决策台：Hero 派单 + Pulse + 工作成果(24h) + 待办 + 简报。",
      points: ["「一键派单」→ staff-picker?intent=dispatch", "「语音下达」打开 Sheet（录音/翻译/发语音）", "工作成果：热力柱 + 头像（过去 24h 产出浏览）", "待办：决策队列 — 需你介入(主) + 今天/明天双栏(次)", "简报带「示例数据」，≠ 主动工作"],
      tip: "待办问「谁下一步」；成果问「交了什么」。" },
    { group: "底栏", id: "03", file: "03-board.html", title: "看板", route: "/{slug}/board",
      lead: "默认「整盘」；可切「按状态」「按人」（泳道按项目）。",
      points: ["整盘：sec-bar 分区 — 概况 KPI + 进行中密排 + 员工用量", "去掉报告占位；事项行对齐首页密排（色点/标签/头像）", "按状态：横滑列 + 列内密排事项", "按人：项目泳道白卡 + 密排行；非整盘可切项目"],
      tip: "切「按状态」左右滑；非整盘点项目 chip。" },
    { group: "底栏", id: "04", file: "04-voice.html", title: "中央录音入口", route: "VoiceOverlay",
      lead: "中央按钮短按打开 Sheet；三项进入独立子页。",
      points: ["录音 → /voice-record（边录边转写）", "翻译 → /voice-translate（实时双语）", "发语音 → /voice-talk（即时下达）", "长按 ≥2s → Overlay，松手 Toast 不发送"],
      tip: "请从 Sheet 进入三个子页，不要把入口页当成发语音页。" },
    { group: "底栏", id: "05", file: "05-workbench.html", title: "工作台", route: "/{slug}/workbench",
      lead: "员工即频道：StaffRail + 会话 + Composer。",
      points: ["Rail 首项「全部」进名册", "运行中折叠为「N steps」", "Runtime banner 英文：needs a runtime…", "阻断条与首页同文案"],
      tip: "点 Rail 切换员工名；点「全部」进名册。" },
    { group: "底栏", id: "06", file: "06-mine.html", title: "我的", route: "/{slug}/mine",
      lead: "资料卡 → 专业版工作区（首页迁入）→ 工作 / 设置与秘书。",
      points: ["专业版：当前方案 + 席位/并发 + SVG 权益四宫 + CTA", "数字员工 → /staff 名册", "秘书设置 → assistant", "右上角组织 chip → 切换工作区（列表 + 确认）"],
      tip: "点专业版卡看占位提示；点右上角组织名可模拟切换。" },
    { group: "语音子页", id: "13", file: "13-voice-record.html", title: "录音", route: "/{slug}/voice-record",
      lead: "本机加密录音：胶囊 + 转写列表 + 底部 Dock。转写为示例。",
      points: ["停止后导出并进详情三 Tab", "录制中条可回录制页", "暂停/停止圆钮 + 工具条", "转写带「示例」徽标"],
      tip: "点暂停再点继续；点停止应进入详情而不是空态重启。" },
    { group: "语音子页", id: "14", file: "14-voice-translate.html", title: "翻译", route: "/{slug}/voice-translate",
      lead: "左右对向气泡；按住说话松开出译。",
      points: ["我（中）靠右 brand；对方（英）靠左 teal", "顶栏：翻译中 · 端侧录音 · 计时", "按住变「松开出译」并追加 mock 行"],
      tip: "分别按住左右两条 HoldSpeakBar。" },
    { group: "语音子页", id: "12", file: "12-voice-talk.html", title: "发语音", route: "/{slug}/voice-talk",
      lead: "选接收员工 + 大 Orb 按住说话（无延迟）。",
      points: ["「发给谁」横滑头像，选中 brand 描边", "当前接收人卡 + 状态", "按住：正在聆听… + EQ；松开 Toast", "「全部」打开选择接收员工 Modal"],
      tip: "这是发语音页本身，不是中央按钮演示页。" },
    { group: "员工", id: "07", file: "07-staff-roster.html", title: "名册", route: "/{slug}/staff",
      lead: "与档案页头同构：域 → 职能 → 代号 → 职责 → 能力 chip → 工位。",
      points: ["主标题是职能名（需求派单助理），不是花名", "职责散文含升级条件，不再单独拆行", "chip：技能·工具·在手·定时", "工位条与档案警示同口径"],
      tip: "点卡片进档案，信息层级应一眼对得上。" },
    { group: "员工", id: "08", file: "08-staff-profile.html", title: "档案", route: "/{slug}/staff/[id]",
      lead: "对齐 StaffDeck 详情：域·职能页头 + 绩效 + 今日活动 + 成长 + 能力资产卡。",
      points: ["页头：调度 / 需求派单助理 + 职责散文（无套话）", "能力 chip：技能·工具·在手·定时", "工作记录：绩效四格 / 今日活动轴 / 成长时间线", "能力资产卡点进「能力」Tab"],
      tip: "工作记录看活动轴与成长；能力看工位未绑定与工具明细。" },
    { group: "员工", id: "09", file: "09-staff-picker.html", title: "员工选择器", route: "/{slug}/staff-picker",
      lead: "formSheet；dispatch / default 双 intent。",
      points: ["#dispatch：派单预填", "#default：设为默认员工", "行：头像 · 名 · 绑定 · 状态"],
      tip: "从首页派单或秘书设置进入，intent 文案会变。" },
    { group: "设置", id: "10", file: "10-assistant-settings.html", title: "秘书设置", route: "/{slug}/more/settings/assistant",
      lead: "默认员工 + 语音偏好 + 简报占位。",
      points: ["默认员工扁平行（名 + ›）", "长按录音阈值 0.5/1/2s", "「松手跳工作台」预留、不接中央长按", "语音入口默认项：录音/翻译/发语音", "简报：B-2 占位说明"],
      tip: "中央长按仍 Toast 不发送；点默认员工进 picker#default。" },
    { group: "内容", id: "11", file: "11-brief-detail.html", title: "简报详情", route: "/{slug}/brief/[id]",
      lead: "任务小队收敛：一句目标 + 横滑成员 +「深入分析探索」。",
      points: ["主卡：渐变头 + 环头像 + 席位 chip", "点头像 / 点成员行 → 独立换人列表（打勾）", "调整小队：开关席位；保存小队", "CTA：深入分析探索"],
      tip: "主卡点头像可直接换人；调整里右侧开关席位。" },
    { group: "内容", id: "15", file: "15-inbox.html", title: "收件箱", route: "/{slug}/inbox",
      lead: "未读点 + 标题 + 状态图标；副行 type-aware 文案 + 时间。",
      points: ["右上 ···：全部已读 / 归档菜单", "未读 brand 圆点 + 字重", "点行进事项（原型进工作台）", "从首页 Pulse / 我的进入"],
      tip: "返回会回到来源页（首页或我的）。" },
    { group: "内容", id: "16", file: "16-projects.html", title: "项目", route: "/{slug}/more/projects",
      lead: "项目列表：图标 + 标题 + 状态/优先级 + 完成数/时间。",
      points: ["按 updated_at 倒序", "右上 + 新建（原型提示）", "从首页 Pulse / 我的进入"],
      tip: "返回同样跟从来源。" }
  ];

  var nav = document.getElementById("nav");
  var aside = document.getElementById("aside");
  var phone = document.getElementById("phone");
  var stageRoute = document.getElementById("stage-route");
  var current = SCREENS[1]; // home

  function renderNav() {
    var html = "";
    var last = "";
    SCREENS.forEach(function (s) {
      if (s.group !== last) {
        html += '<div class="nav-group">' + s.group + "</div>";
        last = s.group;
      }
      html +=
        '<button type="button" class="nav-item' +
        (s.file === current.file ? " on" : "") +
        '" data-file="' +
        s.file +
        '"><span class="id">' +
        s.id +
        "</span>" +
        s.title +
        "</button>";
    });
    nav.innerHTML = html;
    nav.querySelectorAll(".nav-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        go(btn.getAttribute("data-file"), "", { reset: true });
      });
    });
  }

  function renderAside(s) {
    var points = s.points
      .map(function (p) {
        return "<li>" + p + "</li>";
      })
      .join("");
    aside.innerHTML =
      "<h2>" +
      s.title +
      '</h2><div class="route-label">' +
      s.route +
      '</div><p class="lead">' +
      s.lead +
      "</p><h3>对齐要点</h3><ul>" +
      points +
      '</ul><div class="tip">' +
      s.tip +
      '</div><div class="warn">手机内点击会在预览框内跳转，不会回到本讲解页。用左侧导航可随时换屏。名册返回：首页 / 工作台 / 我的 → 从哪来回哪里。</div>';
  }

  function go(file, hash, opts) {
    opts = opts || {};
    var known = SCREENS.find(function (x) {
      return x.file === file;
    });
    current = known || {
      file: file,
      title: file.replace(/\.html$/, ""),
      route: "/" + file.replace(/\.html$/, ""),
      lead: "子页预览（左侧未单独登记时仍可在壳内打开）。",
      points: ["返回：从哪来回哪里（URL ?from=）"],
      tip: "用左侧导航可切回主屏。",
      group: "",
      id: "",
    };
    var qs = opts.query || "embed=1";
    if (qs.indexOf("embed=1") < 0) {
      qs = qs ? "embed=1&" + qs : "embed=1";
    }
    // 左侧直接选屏：不带 from
    if (opts.reset) qs = "embed=1";
    var src = file + "?" + qs;
    if (hash && hash.charAt(0) === "#") src += hash;
    else if (hash) src += hash;
    phone.src = src;
    stageRoute.textContent = current.route;
    renderNav();
    renderAside(current);
    try {
      history.replaceState({ file: file }, "", "#" + file.replace(".html", ""));
    } catch (e) {}
  }

  window.addEventListener("message", function (ev) {
    var data = ev.data || {};
    if (data.type !== "proto-nav") return;
    var file = data.file;
    if (!file || file.indexOf("00-index") >= 0) return;
    go(file, data.hash || "", { query: data.query || "embed=1" });
  });

  // deep link #02-home
  var boot = (location.hash || "").replace(/^#/, "");
  if (boot) {
    var match = SCREENS.find(function (s) {
      return s.file.replace(".html", "") === boot || s.file === boot + ".html" || s.id === boot;
    });
    if (match) current = match;
  }
  renderNav();
  renderAside(current);
  phone.src = current.file + "?embed=1";
  stageRoute.textContent = current.route;
})();
</script>
</body>
</html>

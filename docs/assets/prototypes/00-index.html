<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>utter-office 交互原型讲解</title>
<link rel="stylesheet" href="_shell.css">
</head>
<body>
<div class="shell">
  <aside class="nav">
    <div class="nav-brand">
      <h1>utter-office 原型</h1>
      <p>Context 作战台 · 视觉 Redesign<br>左选屏 · 中预览 · 右说明 · P1–P7 可点通<br><span style="opacity:.85">壳内零教学文案 · 状态图形化 · brand #3B6FFF</span></p>
    </div>
    <div class="nav-scroll" id="nav"></div>
  </aside>

  <main class="stage">
    <div class="stage-bar">
      <span>当前预览</span>
      <span class="route" id="stage-route">/{slug}/home</span>
    </div>
    <div class="phone-frame">
      <iframe id="phone" title="App 预览" src="02-home.html?embed=1"></iframe>
    </div>
  </main>

  <aside class="aside">
    <div class="aside-scroll" id="aside"></div>
  </aside>
</div>

<script>
(function () {
  var SCREENS = [
    { group: "底栏", id: "01", file: "01-tab-ia.html", title: "信息架构", route: "tabs/_layout",
      lead: "底栏 2+1+2。职责：成果 / 进度 / Context / 派活 / 配置。视觉 = 作战台。",
      points: ["选中 Tab：图标井浅蓝底 + brand 色", "中央按钮标 Context，非录音产品", "叙事：人像管同事一样管数字员工"],
      tip: "视觉 Redesign 后一眼读出作战台；P1–P7 状态机仍有效。在预览里点底栏切换。" },
    { group: "底栏", id: "02", file: "02-home.html", title: "首页", route: "/{slug}/home",
      lead: "拿成果 → 工作队列 → 新闻简报。",
      points: ["今日成果可验收", "需我处理 / 正在推进", "新闻行 + 短建议", "行业安装时已选"],
      tip: "首屏同时见成果与 HITL；新闻点进详情再派活。" },
    { group: "底栏", id: "03", file: "03-board.html", title: "看板", route: "/{slug}/board",
      lead: "默认进度：事项流 + 进度条。按小队 / 按状态为辅。",
      points: ["进度首屏", "切换小队回看板", "点事项进工作台详情"],
      tip: "P3：进度卡 UO-24 → 工作台。切换小队应留在看板。" },
    { group: "底栏", id: "04", file: "04-voice.html", title: "中央 Context 入口", route: "VoiceOverlay",
      lead: "捕捉上下文 / 下达。Sheet 三入口差异化。",
      points: ["录音捕捉 → 行动信号候选", "翻译 / 即时下达", "底栏中心钮标 Context"],
      tip: "P6：停止 → 候选 → 待接活 UO-40/41。语音子页返回默认 Context 入口。" },
    { group: "底栏", id: "05", file: "05-workbench.html", title: "工作台", route: "/{slug}/workbench",
      lead: "编排台：派活 / 组队 · 劳动力条 · 三段板。非发文字。",
      points: ["顶栏小队 + Runtime", "派活 + 组队执行 CTA", "点人筛队列", "详情 Composer=补充指令"],
      tip: "P4：派活 → picker → 回小队在跑。" },
    { group: "底栏", id: "06", file: "06-mine.html", title: "我的", route: "/{slug}/mine",
      lead: "配置驾驶舱；行业与新闻方向在此回改。",
      points: ["行业与简报 / 关注类别", "员工小队 Runtime", "无首页设定入口"],
      tip: "行业在安装选定；我的里可回改。" },
    { group: "语音子页", id: "13", file: "13-voice-record.html", title: "录音捕捉", route: "/{slug}/voice-record",
      lead: "Context：停录后出 1–2 条事项候选，确认进待接活。",
      points: ["停止 → 候选 Sheet", "确认写 sessionStorage → fromVoice=1", "内部转写仍为 mock"],
      tip: "点停止 → 勾选候选 →「确认进待接活」。" },
    { group: "语音子页", id: "14", file: "14-voice-translate.html", title: "翻译", route: "/{slug}/voice-translate",
      lead: "左右对向气泡；按住说话松开出译。内部流程不动。",
      points: ["壳/返回与主路径一致", "不改内部 ASR 演示"],
      tip: "分别按住左右 HoldSpeakBar。" },
    { group: "语音子页", id: "12", file: "12-voice-talk.html", title: "即时下达", route: "/{slug}/voice-talk",
      lead: "选接收员工 + Orb 按住；松手 Toast「已入队下达」（原型演示）。",
      points: ["与现网 App 长按不发送解耦——仅原型", "可选跳转工作台进行中"],
      tip: "按住松开 → toast → 可选进进行中。" },
    { group: "员工", id: "07", file: "07-staff-roster.html", title: "名册", route: "/{slug}/staff",
      lead: "劳动力名册：负载 · Runtime · 可派发。",
      points: ["职能名为主标题", "负载进度条 + Runtime 绑定态", "筛选：全部 / 可派发 / 忙碌 / 未绑定"],
      tip: "点卡片进档案；未绑定员工点进能力 Tab。" },
    { group: "员工", id: "08", file: "08-staff-profile.html", title: "档案", route: "/{slug}/staff/[id]",
      lead: "StaffDeck 档案：岗位边界 · 能力资产 · Trace。",
      points: ["看队列 → workbench?labor=", "派活给他 → picker 预选事项", "无死 # 链"],
      tip: "点「看队列」应只见该员工事项。" },
    { group: "员工", id: "09", file: "09-staff-picker.html", title: "指派", route: "/{slug}/staff-picker",
      lead: "组队模板置顶；确认后写回「小队在跑」。",
      points: ["#squad 模板优先", "待接活芯片切换目标事项", "回写 assign=squad|人", "#default → 已设为默认员工"],
      tip: "P4：从工作台「组队」→ 产品小队 → 回小队在跑。" },
    { group: "配置", id: "10", file: "10-assistant-settings.html", title: "助理与自动化", route: "/{slug}/more/settings/assistant",
      lead: "默认指派 · 关注类别 · 语音偏好 · 定时。",
      points: ["默认员工 + 默认小队", "关注类别 → 26", "推送时段"],
      tip: "点「关注类别」可自由增删识别主题。" },
    { group: "配置", id: "20", file: "20-skills.html", title: "技能", route: "/{slug}/skills",
      lead: "Multica Skills 可复用能力包。影响：派活时可选技能边界。",
      points: ["技能名 + 版本 + 挂载员工", "如何影响主路径：员工能力边界"],
      tip: "轻量 mock；从「我的」进入。" },
    { group: "配置", id: "21", file: "21-sop.html", title: "SOP", route: "/{slug}/sop",
      lead: "状态机流程。影响：事项执行步骤模板。",
      points: ["节点可视化", "如何影响主路径：执行流步骤"],
      tip: "对齐 StaffDeck 流程型技能。" },
    { group: "配置", id: "22", file: "22-knowledge.html", title: "知识库", route: "/{slug}/knowledge",
      lead: "业务语义资产。影响：阻塞补充与验收口径。",
      points: ["主题 · 引用次数", "如何影响主路径：口径与阻塞解除"],
      tip: "从「我的」进入。" },
    { group: "配置", id: "23", file: "23-runtime.html", title: "Runtime", route: "/{slug}/runtime",
      lead: "执行环境。影响：排队 / 挤兑风险洞察。",
      points: ["online / offline", "如何影响主路径：进行中能否开跑"],
      tip: "从「我的」自动化分区进入。" },
    { group: "配置", id: "24", file: "24-handover.html", title: "交接与审计", route: "/{slug}/handover",
      lead: "Trace / 反馈。影响：差评回 SOP、阻塞交接。",
      points: ["阻塞交接", "如何影响主路径：审计与续跑"],
      tip: "从「我的」进入。" },
    { group: "配置", id: "25", file: "25-squads.html", title: "切换小队", route: "/{slug}/squads",
      lead: "工作台看哪一组人。不是派活。",
      points: ["产品小队 / 客户跟进小队", "从工作台「切换小队」进入"],
      tip: "从「我的」或助理设置进入；设默认小队会回写来源页。" },
    { group: "设置", id: "17", file: "17-settings.html", title: "设置", route: "/{slug}/more/settings",
      lead: "账户 + 录音悬浮窗开关。",
      points: ["悬浮窗仅 Android", "退出登录"],
      tip: "打开开关会弹出系统权限确认。" },
    { group: "内容", id: "11", file: "11-brief-detail.html", title: "简报详情", route: "/{slug}/brief/[id]",
      lead: "新闻体详情 · 按关注类别 hash 切换。",
      points: ["#runtime/#client/#promise/#scope", "CTA 进待接活对应项"],
      tip: "P5：Runtime 简报 → UO-34 待接活 → 可再派活。" },
    { group: "内容", id: "18", file: "18-briefs.html", title: "新闻简报", route: "/{slug}/briefs",
      lead: "按关注类别筛选的新闻流；每条带短建议。",
      points: ["资讯行密度", "建议一行", "类别在我的管理"],
      tip: "从首页「全部」进入。" },
    { group: "配置", id: "26", file: "26-watch-topics.html", title: "关注类别", route: "/{slug}/watch-topics",
      lead: "自由创建系统要识别的主题。",
      points: ["添加 / 开关 / 删除", "示例一键加入", "决定简报抓什么"],
      tip: "从首页「+ 自建」或设置进入。" },
    { group: "启动", id: "27", file: "27-onboarding.html", title: "启动设置", route: "/onboarding",
      lead: "安装后选行业与简报方向。",
      points: ["行业单选", "关注方向多选", "写入 session · 首页可读"],
      tip: "选完进首页；可跳过。" },
    { group: "启动", id: "28", file: "28-industry-brief.html", title: "行业与简报", route: "/{slug}/industry-brief",
      lead: "启动选择的回改页。",
      points: ["改行业", "改简报方向", "链回启动设置"],
      tip: "从「我的」进入。" },
    { group: "内容", id: "19", file: "19-recordings.html", title: "录音列表", route: "/{slug}/recordings",
      lead: "本机录音条目：标题 + 时长 + 时间。",
      points: ["从「我的」进入", "空态引导短按中央按钮"],
      tip: "列表仅为讲解壳 mock。" },
    { group: "内容", id: "15", file: "15-inbox.html", title: "待我处理", route: "/{slug}/inbox",
      lead: "审批 / 补充 / 验收；「标已处理」从列表移除。",
      points: ["点行深链 ?issue=", "标已处理 mock 持久到 session"],
      tip: "P2：从首页「全部」进入；标已处理后行消失。" },
    { group: "内容", id: "16", file: "16-projects.html", title: "项目", route: "/{slug}/more/projects",
      lead: "项目列表（遗留入口，可从旧链进入）。",
      points: ["按 updated_at 倒序", "右上 + 新建（原型提示）"],
      tip: "主路径已转向小队事项，本页保留兼容。" }
  ];

  var nav = document.getElementById("nav");
  var aside = document.getElementById("aside");
  var phone = document.getElementById("phone");
  var stageRoute = document.getElementById("stage-route");
  var current = SCREENS[1]; // home

  function renderNav() {
    var html = "";
    var last = "";
    SCREENS.forEach(function (s) {
      if (s.group !== last) {
        html += '<div class="nav-group">' + s.group + "</div>";
        last = s.group;
      }
      html +=
        '<button type="button" class="nav-item' +
        (s.file === current.file ? " on" : "") +
        '" data-file="' +
        s.file +
        '"><span class="id">' +
        s.id +
        "</span>" +
        s.title +
        "</button>";
    });
    nav.innerHTML = html;
    nav.querySelectorAll(".nav-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        go(btn.getAttribute("data-file"), "", { reset: true });
      });
    });
  }

  function renderAside(s) {
    var points = s.points
      .map(function (p) {
        return "<li>" + p + "</li>";
      })
      .join("");
    aside.innerHTML =
      "<h2>" +
      s.title +
      '</h2><div class="route-label">' +
      s.route +
      '</div><p class="lead">' +
      s.lead +
      "</p><h3>对齐要点</h3><ul>" +
      points +
      '</ul><div class="tip">' +
      s.tip +
      '</div><div class="warn">视觉 = Context 作战台（token #3B6FFF）。手机内点击在预览框跳转；左侧可换屏。一期 ISSUE_DB 闭环仍有效。</div>';
  }

  function go(file, hash, opts) {
    opts = opts || {};
    var known = SCREENS.find(function (x) {
      return x.file === file;
    });
    current = known || {
      file: file,
      title: file.replace(/\.html$/, ""),
      route: "/" + file.replace(/\.html$/, ""),
      lead: "子页预览（左侧未单独登记时仍可在壳内打开）。",
      points: ["返回：从哪来回哪里（URL ?from=）"],
      tip: "用左侧导航可切回主屏。",
      group: "",
      id: "",
    };
    var qs = opts.query || "embed=1";
    if (qs.indexOf("embed=1") < 0) {
      qs = qs ? "embed=1&" + qs : "embed=1";
    }
    // 左侧直接选屏：不带 from
    if (opts.reset) qs = "embed=1";
    var src = file + "?" + qs;
    if (hash && hash.charAt(0) === "#") src += hash;
    else if (hash) src += hash;
    phone.src = src;
    stageRoute.textContent = current.route;
    renderNav();
    renderAside(current);
    try {
      history.replaceState({ file: file }, "", "#" + file.replace(".html", ""));
    } catch (e) {}
  }

  window.addEventListener("message", function (ev) {
    var data = ev.data || {};
    if (data.type !== "proto-nav") return;
    var file = data.file;
    if (!file || file.indexOf("00-index") >= 0) return;
    go(file, data.hash || "", { query: data.query || "embed=1" });
  });

  // deep link #02-home
  var boot = (location.hash || "").replace(/^#/, "");
  if (boot) {
    var match = SCREENS.find(function (s) {
      return s.file.replace(".html", "") === boot || s.file === boot + ".html" || s.id === boot;
    });
    if (match) current = match;
  }
  renderNav();
  renderAside(current);
  phone.src = current.file + "?embed=1";
  stageRoute.textContent = current.route;
})();
</script>
</body>
</html>

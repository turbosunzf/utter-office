<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2A2A2E;display:flex;gap:24px;padding:24px;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
.phone{width:390px;height:844px;background:#F5F6F8;border-radius:44px;border:1px solid #000;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 16px}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px 10px;font-size:15px;font-weight:600}
.page-title{margin:14px 0 4px;font-size:20px;font-weight:700;color:#1C1C1E}
.page-sub{margin-bottom:14px;font-size:12px;color:#8E8E93}
.cards{flex:1;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:1px solid #E5E5EA;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.card .ic{width:40px;height:40px;border-radius:12px;background:#EDF1FB;color:#3B6FFF;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.card .body{flex:1}
.card .t{font-size:15px;font-weight:600;color:#1C1C1E}
.card .d{font-size:11px;color:#8E8E93;margin-top:2px;line-height:1.5}
.card .tag{font-size:10px;color:#fff;background:#3B6FFF;border-radius:6px;padding:2px 6px}
.card .tag.badge-t{background:#FF9500}
.card.central{background:linear-gradient(135deg,#2F62F0,#3B6FFF 55%,#5B8AFF);border:none}
.card.central .ic{background:rgba(255,255,255,.22);color:#fff}
.card.central .t{color:#fff}
.card.central .d{color:rgba(255,255,255,.85)}
.tabbar{height:88px;background:#fff;border-top:1px solid #E5E5EA;display:flex;align-items:center;justify-content:space-around;padding:0 4px 26px;margin:0 -16px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8E8E93;width:62px}
.tab.active{color:#3B6FFF}
.tab-icon{width:24px;height:24px;border-radius:6px;background:#E1E1E8;position:relative}
.tab.badge .tab-icon::after{content:"3";position:absolute;top:-4px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:#3B6FFF;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.tab.badge.orange .tab-icon::after{content:"2";background:#FF9500}
.center{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#2F62F0,#3B6FFF 55%,#5B8AFF);margin-top:-28px;box-shadow:0 6px 16px rgba(59,111,255,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
</style>
</head>

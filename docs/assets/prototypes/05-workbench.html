<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>05 工作台 · utter-office</title>
<script>if(/(?:^|[?&])embed=1(?:&|$)/.test(location.search)||(parent!==window))document.documentElement.classList.add("embed")</script>
<link rel="stylesheet" href="_shared.css">
<style>
.wb-board { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.wb-detail { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.wb-detail.hidden, .wb-board.hidden { display: none !important; }
.detail-scroll { flex: 1; overflow-y: auto; padding: 12px 16px 16px; -webkit-overflow-scrolling: touch; }
.detail-scroll::-webkit-scrollbar { display: none; }
.panel-scroll { flex: 1; overflow-y: auto; padding: 8px 0 16px; -webkit-overflow-scrolling: touch; }
.panel-scroll::-webkit-scrollbar { display: none; }
.deliver-box {
  background: #fff; border: 1px solid rgba(15,23,42,.06); border-radius: 12px;
  padding: 12px; margin-top: 12px;
}
.deliver-box .h { font-size: 12px; font-weight: 700; color: var(--muted-fg); margin-bottom: 8px; }
.deliver-box .row {
  display: flex; align-items: center; gap: 8px; padding: 8px 0;
  border-top: 1px solid var(--hairline); font-size: 13px;
}
.deliver-box .row:first-of-type { border-top: none; }
.detail-acts { display: flex; gap: 8px; margin-top: 12px; }
.detail-acts .btn {
  flex: 1; height: 42px; border-radius: 10px; border: none; font-size: 14px; font-weight: 800;
  cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center;
}
.detail-acts .btn.pri { background: var(--brand-hex); color: #fff; }
.detail-acts .btn.ghost { background: var(--well); color: var(--text-primary); }

.wb-cta {
  margin: 8px 12px 0;
  display: flex; gap: 8px;
}
.wb-cta a {
  flex: 1; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; font-weight: 800; text-decoration: none;
}
.wb-cta .pri { background: var(--brand-hex); color: #fff; }
.wb-cta .ghost {
  background: var(--surface-2); color: var(--brand-hex);
  border: 1px solid rgba(59,111,255,.28);
}
.labor-rail {
  display: flex; gap: 10px; overflow-x: auto;
  padding: 10px 12px 6px; -webkit-overflow-scrolling: touch;
}
.labor-rail::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<p class="stage-note"><b>工作台</b> · <a href="00-index.html">目录</a></p>
<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><div class="right"><span>●●●</span><span>5G</span><span>🔋</span></div></div>

    <div class="wb-board" data-wb-board>
      <div class="app-header" style="min-height:44px">
        <div class="title-wrap">
          <div class="title" style="font-size:17px">工作台</div>
          <div class="subtitle" style="display:flex;align-items:center;gap:6px;margin-top:2px">
            <a href="25-squads.html" style="color:inherit;text-decoration:none;font-weight:700" data-squad-label>产品小队 ›</a>
            <span class="runtime-pill"><i></i>在线</span>
            <span style="font-size:11px;color:var(--text-tertiary)" data-squad-stats-short></span>
          </div>
        </div>
        <div class="actions">
          <a class="icon-btn" href="07-staff-roster.html" aria-label="名册">
            <svg class="ic" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </a>
        </div>
      </div>

      <!-- PRD：派活 / 组队 = 主入口，非发文字 -->
      <div class="wb-cta">
        <a class="pri" href="09-staff-picker.html#dispatch" data-prep-assign="auto" data-assign-mode="person">
          <svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          派活
        </a>
        <a class="ghost" href="09-staff-picker.html#squad" data-prep-assign="auto" data-assign-mode="squad">组队执行</a>
      </div>

      <!-- 劳动力条：点人筛队列，非开聊 -->
      <div class="labor-rail">
        <button type="button" class="labor-item sel" data-labor data-name="all">
          <div class="av" style="background:var(--brand-hex)">全</div>
          <span class="lb">全部</span>
        </button>
        <button type="button" class="labor-item" data-labor data-name="Alex">
          <div class="av" style="background:#60A5FA">A<span class="human-tag">人</span></div>
          <span class="lb">Alex</span>
          <span class="q">1</span>
        </button>
        <button type="button" class="labor-item" data-labor data-name="mika">
          <div class="av" style="background:#F87171">m</div>
          <span class="lb">mika</span>
          <span class="q">2</span>
        </button>
        <button type="button" class="labor-item" data-labor data-name="nova">
          <div class="av" style="background:#34D399">n</div>
          <span class="lb">nova</span>
          <span class="q">1</span>
        </button>
        <button type="button" class="labor-item" data-labor data-name="kai">
          <div class="av" style="background:#A78BFA">k</div>
          <span class="lb">kai</span>
          <span class="q">1</span>
        </button>
      </div>

      <div class="wb-seg" data-wb-seg>
        <button type="button" class="on" data-wb="doing"><span class="lab">小队在跑<span class="n">0</span></span></button>
        <button type="button" data-wb="todo"><span class="lab">待接活<span class="n">0</span></span></button>
        <button type="button" data-wb="review"><span class="lab">待验收<span class="n">0</span></span></button>
      </div>

      <div class="panel-scroll">
        <div data-wb-panel="doing"><div class="empty-hint">加载中…</div></div>
        <div class="hidden" data-wb-panel="todo"><div class="empty-hint">加载中…</div></div>
        <div class="hidden" data-wb-panel="review"><div class="empty-hint">加载中…</div></div>
      </div>
    </div>

    <div class="wb-detail hidden" data-wb-detail>
      <div class="app-header">
        <button type="button" class="icon-btn" data-wb-back aria-label="返回">
          <svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="title-wrap">
          <div class="title" style="font-size:16px" data-detail-title>—</div>
          <div class="subtitle"><span data-detail-id>—</span> · <span data-detail-chip></span></div>
        </div>
        <div class="actions">
          <a class="icon-btn" href="09-staff-picker.html#squad" aria-label="改派" data-assign-issue="" data-assign-mode="squad">
            <svg class="ic" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </a>
        </div>
      </div>

      <div class="detail-scroll">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px">
          <div data-detail-squad></div>
          <span class="runtime-pill"><i></i>MacBook · 在线</span>
        </div>
        <div class="block-reason hidden" data-detail-block style="font-size:12px;color:var(--destructive);background:rgba(239,68,68,.08);border-radius:8px;padding:8px 10px;margin-bottom:10px"></div>

        <div class="home-sec-bar" style="padding-left:0"><div class="tit">生命周期</div></div>
        <div class="timeline" data-detail-lifecycle style="background:#fff;border-radius:12px;padding:12px 14px;border:1px solid rgba(15,23,42,.06)"></div>

        <div class="home-sec-bar" style="padding-left:0;margin-top:14px"><div class="tit">执行流</div><div class="meta">实时</div></div>
        <div class="step-stream" data-detail-steps></div>

        <div class="deliver-box">
          <div class="h">交付物</div>
          <div data-detail-deliverables></div>
        </div>

        <div class="detail-acts" data-detail-acts></div>
      </div>

      <div class="composer-slim">
        <div class="hint" data-detail-composer-hint>补充指令…</div>
        <button type="button" class="send" aria-label="发送">
          <svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
    </div>

    <nav class="tabbar">
      <a class="tab" href="02-home.html">
        <div class="glyph"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        首页
      </a>
      <a class="tab" href="03-board.html">
        <div class="glyph"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></div>
        看板
      </a>
      <div class="tab-center-slot">
        <button type="button" class="record-btn" id="record-btn" aria-label="Context">
          <svg class="ic mic" style="width:26px;height:26px;color:#fff" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <span class="eq"><i></i><i></i><i></i><i></i></span>
        </button>
      </div>
      <a class="tab active" href="05-workbench.html">
        <div class="glyph"><svg class="ic" style="width:22px;height:22px;stroke-width:2.35" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></div>
        工作台<span class="tab-badge">2</span>
      </a>
      <a class="tab" href="06-mine.html">
        <div class="glyph"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        我的
      </a>
    </nav>
  </div>
</div>
<script src="_shared.js"></script>
</body>
</html>
